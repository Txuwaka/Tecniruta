<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c25">
<title>TSNU · Recogidas y destinos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{color-scheme:dark;--bg:#0b151d;--panel:#101f29;--card:#182b37;--line:#2a414f;--text:#eef5f6;--muted:#9bb0bd;--accent:#63e3ba;--ink:#07261c;--blue:#79c9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}
body.light{color-scheme:light;--bg:#edf3f5;--panel:#fff;--card:#eef4f6;--line:#cad9df;--text:#142d3b;--muted:#4a6574;--accent:#007f60;--ink:#fff;--blue:#006ea5}
button,input,select{font:inherit}
button,a.btn{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:hover,a.btn:hover{border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:750}
.small{font-size:12px;color:var(--muted)}
header{height:78px;display:flex;justify-content:space-between;align-items:center;padding:12px 26px;border-bottom:1px solid var(--line);gap:12px}
header .brand{display:flex;align-items:center;gap:12px}
.logo{border-radius:12px;background:var(--accent);color:var(--ink);font-size:25px;width:44px;height:44px;display:grid;place-items:center}
h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.5px}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:750;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.badge{border:1px solid var(--line);padding:5px 10px;border-radius:30px;color:var(--muted);font-size:12px}
.badge.ok{color:var(--accent)}
main{display:grid;grid-template-columns:380px 1fr;height:calc(100dvh - 78px)}
aside{padding:24px;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}
h2{font-size:26px;letter-spacing:-1px;margin:4px 0 8px}h3{font-size:14px;margin:22px 0 10px}
.origin{border:1px solid var(--line);border-radius:14px;padding:14px}
.origin strong{display:block;font-size:14px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;min-height:46px}
.stop{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.number{background:var(--accent);color:var(--ink);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.stop strong{font-size:13px;display:block}
.stop button{padding:0;width:34px;min-height:44px;border:0;background:transparent}
.empty{border:1px dashed var(--line);padding:20px 12px;border-radius:12px;color:var(--muted);font-size:13px;text-align:center}
.wide{width:100%}
.route-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.route-actions .primary{grid-column:1/-1}
.map-area{position:relative;min-width:0;display:flex;flex-direction:column}
#map{flex:1;min-height:240px;background:#263c49;z-index:1}
body:not(.light) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.78) saturate(.6)}
.map-tools{position:absolute;top:20px;left:20px;right:20px;z-index:450;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.map-tools>*{pointer-events:auto}
.map-tools button{background:var(--panel);box-shadow:0 4px 18px #0003}
.map-caption{position:absolute;top:82px;left:20px;z-index:450;background:var(--accent);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:bold;pointer-events:none;display:none;}
.dashboard{background:var(--panel);border-top:1px solid var(--line);padding:18px 24px;z-index:2}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.stat b{display:block;font-size:30px;letter-spacing:-1px;line-height:1.3;color:var(--accent)}
.stat label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted)}
.pin{background:var(--accent);color:var(--ink);border:3px solid #fff;border-radius:50%;text-align:center;font:bold 14px/28px system-ui;box-shadow:0 3px 15px #0006}
.ambulance{font-size:29px;line-height:40px;background:#fff;border-radius:50%;text-align:center;box-shadow:0 0 0 6px #63e3ba55}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:12px;box-shadow:0 4px 30px #0005;font-size:13px}
#toast:empty{display:none}

/* Modificaciones para buscador integrado */
.search-row { display: flex; gap: 6px; margin-top: 5px; }
.search-row input { flex: 1; min-height: 40px; font-size: 13px; }
.search-row button { min-width: 44px; padding: 0; font-size: 16px; }
.results-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.results-list button { text-align: left; justify-content: flex-start; font-size: 12px; padding: 8px; border-color: var(--line); }
.selected-point { background: var(--accent); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-top: 5px; display: flex; justify-content: space-between; align-items: center;}
label.field{display:block;font-size:12px;color:var(--muted);margin:14px 0 4px}
.service{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.service .name{font-size:13px;font-weight:700}
.service .path{margin:7px 0;font-size:12px;overflow-wrap:anywhere}
.service .actions{display:flex;gap:6px}
.service .actions button{font-size:12px;min-height:36px;padding:5px 10px}
#editor{border:1px solid var(--accent);padding:16px;border-radius:14px;margin-top:12px;background:var(--card)}
.type{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--accent)}
.pin.pickup, .type.pickup{color:var(--ink);background:var(--accent)}
.pin.dropoff, .type.dropoff{color:#142532;background:#79c9ff}
.pin.finish, .type.finish{color:#142532;background:#edb76a}
.number.dropoff{background:#79c9ff;color:#142532}
.number.finish{background:#edb76a;color:#142532}

@media(max-width:760px){
    main{display:flex;flex-direction:column;height:auto}
    .map-area{order:0;height:45dvh;min-height:300px}
    aside{order:1;border:0;padding:20px 16px;overflow:visible}
    .route-actions{position:sticky;bottom:0;padding:10px 0;background:var(--panel);z-index:500;}
    header h1{font-size:16px} header .small{display:none}
}
@media(min-width:1500px){main{grid-template-columns:420px 1fr}}
</style>
</head>
<body>
<header>
    <div class="brand">
        <div class="logo">✚</div>
        <div><h1>TSNU <span style="color:var(--accent)">Rutas</span></h1></div>
    </div>
    <div class="tools"><span class="badge" id="gpsStatus">GPS desactivado</span><button id="theme">☀</button></div>
</header>
<main>
<aside id="planner">
    <h2>Organiza tu ruta.</h2>
    
    <section class="origin">
        <div class="eyebrow">01 · Punto de salida</div>
        <strong id="originName">Ubicación de inicio</strong>
        <div class="row" style="margin-top:10px">
            <button id="gps" class="primary grow">◎ Usar GPS</button>
            <button id="btnMapOrigin">⌖ Tocar en mapa</button>
        </div>
        <div class="search-row">
            <input id="originSearch" placeholder="O busca calle, número, pueblo...">
            <button id="btnSearchOrigin">🔍</button>
        </div>
        <div id="originResults" class="results-list"></div>
    </section>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
        <h3>02 · Servicios</h3>
        <button id="newService">＋ Añadir</button>
    </div>
    <div id="services"></div>
    
    <section id="editor" hidden>
        <div class="row">
            <strong id="editorTitle" class="grow">Nuevo servicio</strong>
            <button id="cancelEditor">×</button>
        </div>
        
        <label class="field">Referencia del servicio</label>
        <input id="serviceName" placeholder="Ej: Alta H. La Paz">
        
        <label class="field">Lugar de Recogida</label>
        <div id="pickupSelected" class="selected-point" hidden>
            <span id="pickupText"></span>
            <button id="clearPickup" style="min-height:24px;padding:2px 8px;border:0;background:transparent;color:inherit">✕</button>
        </div>
        <div id="pickupSearchBox">
            <div class="search-row">
                <input id="pickupSearch" placeholder="Ej: Calle Mayor 5, Alcalá...">
                <button id="btnSearchPickup">🔍</button>
                <button id="btnMapPickup">⌖</button>
            </div>
            <div id="pickupResults" class="results-list"></div>
        </div>
        
        <label class="field">Lugar de Destino</label>
        <div id="dropoffSelected" class="selected-point" hidden style="background:#79c9ff;">
            <span id="dropoffText"></span>
            <button id="clearDropoff" style="min-height:24px;padding:2px 8px;border:0;background:transparent;color:inherit">✕</button>
        </div>
        <div id="dropoffSearchBox">
            <div class="search-row">
                <input id="dropoffSearch" placeholder="Ej: Calle de la iglesia 13, Valdemanco">
                <button id="btnSearchDropoff">🔍</button>
                <button id="btnMapDropoff">⌖</button>
            </div>
            <div id="dropoffResults" class="results-list"></div>
        </div>
        
        <button class="primary wide" id="saveService" style="margin-top:16px" disabled>Guardar servicio</button>
    </section>
    
    <h3 style="margin-top:24px">03 · Fin de ruta y Opciones</h3>
    <div class="row">
        <button id="finishLast" class="grow pointButton">Acabar en destino</button>
        <button id="finishBase" class="grow pointButton">Volver a Base S. Fernando</button>
    </div>
    <div style="margin-top:8px">
        <select id="capacity">
            <option value="1">1 paciente a la vez</option>
            <option value="6" selected>Agrupación libre</option>
        </select>
    </div>
    
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
        <h3>04 · Recorrido</h3>
        <button id="clear">Vaciar Todo</button>
    </div>
    <div id="stops"></div>
    
    <div class="route-actions">
        <button id="organize" class="primary">✦ Optimizar Ruta</button>
        <button id="navigate">Abrir Maps ↗</button>
    </div>
    <div id="legs" class="small" style="margin-top:12px; color:var(--muted)"></div>
</aside>
<section class="map-area">
    <div id="map"></div>
    <div class="map-tools">
        <div class="row">
            <button id="center">◎ Centrar</button>
            <button id="fit">⛶ Ruta</button>
        </div>
    </div>
    <div class="map-caption" id="mapHint">Toca un punto en el mapa <button id="cancelPick" style="margin-left:10px;padding:4px 8px;min-height:0;color:black">Cancelar</button></div>
    <div class="dashboard">
        <div class="stats">
            <div class="stat"><label>Distancia</label><b id="distance">— km</b></div>
            <div class="stat"><label>Conducción</label><b id="duration">— min</b></div>
            <div class="stat"><label>Llegada</label><b id="arrival">—:—</b></div>
        </div>
        <p id="routeStatus" class="small" style="margin-top:10px">Esperando servicios...</p>
    </div>
</section>
</main>
<div id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function button(text,label,fn){const b=element('button','',text);if(label)b.setAttribute('aria-label',label);b.onclick=fn;return b;}
let toastTimer; function toast(text){$('toast').textContent=text; $('toast').style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>$('toast').style.display='none',4000);}

try{document.body.classList.toggle('light',localStorage.getItem('tsnu-theme')==='light')}catch{}$('theme').onclick=()=>{document.body.classList.toggle('light');try{localStorage.setItem('tsnu-theme',document.body.classList.contains('light')?'light':'dark')}catch{}};

const map=L.map('map',{center:[40.44,-3.70],zoom:10,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

const S={origin:null,finish:null,services:[],order:[],capacity:6,nextId:1,watch:null,busy:false};
let draft=null, picking=null, routeLine=null, originMarker=null, accuracyCircle=null;
const markers=L.layerGroup().addTo(map);

// Buscador ArcGIS (Gratis, sin API Key, excelente para calles y pueblos en España)
async function searchAddress(query, resultsDiv, target) {
    if(query.length < 3) return;
    resultsDiv.innerHTML = '<span class="small">Buscando...</span>';
    try {
        const url = `https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&singleLine=${encodeURIComponent(query + ', Madrid, España')}&maxLocations=5`;
        const res = await fetch(url);
        const data = await res.json();
        resultsDiv.innerHTML = '';
        if(!data.candidates || data.candidates.length === 0) {
            resultsDiv.innerHTML = '<span class="small" style="color:var(--accent)">No encontrado. Usa "Tocar en mapa".</span>';
            return;
        }
        data.candidates.forEach(c => {
            const btn = button(c.address, null, () => selectPoint(target, {name: c.address, lat: c.location.y, lng: c.location.x}));
            resultsDiv.append(btn);
        });
    } catch(e) {
        resultsDiv.innerHTML = '<span class="small">Error al buscar.</span>';
    }
}

function selectPoint(target, p) {
    if(target === 'origin') {
        stopGPS(); S.origin = {...p, type: 'manual'}; paintOrigin();
        $('originSearch').value = ''; $('originResults').innerHTML = '';
    } else if(target === 'pickup') {
        draft.pickup = {...p}; 
        $('pickupText').textContent = p.name;
        $('pickupSelected').hidden = false; $('pickupSearchBox').hidden = true;
    } else if(target === 'dropoff') {
        draft.dropoff = {...p};
        $('dropoffText').textContent = p.name;
        $('dropoffSelected').hidden = false; $('dropoffSearchBox').hidden = true;
    }
    cancelPick(); map.setView([p.lat, p.lng], 15); checkDraft(); render();
}

$('btnSearchOrigin').onclick=()=> searchAddress($('originSearch').value, $('originResults'), 'origin');
$('btnSearchPickup').onclick=()=> searchAddress($('pickupSearch').value, $('pickupResults'), 'pickup');
$('btnSearchDropoff').onclick=()=> searchAddress($('dropoffSearch').value, $('dropoffResults'), 'dropoff');

// Busqueda al pulsar Enter
['originSearch','pickupSearch','dropoffSearch'].forEach(id => {
    $(id).addEventListener('keypress', function (e) {
        if (e.key === 'Enter') $(id.replace('Search', 'btnSearch')).click();
    });
});

$('clearPickup').onclick=()=>{draft.pickup=null; $('pickupSelected').hidden=true; $('pickupSearchBox').hidden=false; $('pickupSearch').value=''; checkDraft();};
$('clearDropoff').onclick=()=>{draft.dropoff=null; $('dropoffSelected').hidden=true; $('dropoffSearchBox').hidden=false; $('dropoffSearch').value=''; checkDraft();};

function checkDraft(){ $('saveService').disabled = !(draft?.pickup && draft?.dropoff); }

function edit(id=null){
    const s = S.services.find(s=>s.id===id);
    draft = s ? {id: s.id, name: s.name, pickup: {...s.pickup}, dropoff: {...s.dropoff}, status: s.status} : {id:null, name:'Servicio '+S.nextId, pickup:null, dropoff:null, status:'pending'};
    $('editorTitle').textContent = s ? 'Editar' : 'Nuevo Servicio';
    $('serviceName').value = draft.name;
    
    if(draft.pickup) { $('pickupText').textContent = draft.pickup.name; $('pickupSelected').hidden=false; $('pickupSearchBox').hidden=true; }
    else { $('pickupSelected').hidden=true; $('pickupSearchBox').hidden=false; $('pickupSearch').value=''; $('pickupResults').innerHTML=''; }
    
    if(draft.dropoff) { $('dropoffText').textContent = draft.dropoff.name; $('dropoffSelected').hidden=false; $('dropoffSearchBox').hidden=true; }
    else { $('dropoffSelected').hidden=true; $('dropoffSearchBox').hidden=false; $('dropoffSearch').value=''; $('dropoffResults').innerHTML=''; }
    
    $('editor').hidden=false; checkDraft();
}

$('newService').onclick = () => edit();
$('cancelEditor').onclick = () => { draft=null; $('editor').hidden=true; cancelPick(); };

$('saveService').onclick = () => {
    draft.name = $('serviceName').value.trim() || 'Servicio '+S.nextId;
    if(draft.id) S.services[S.services.findIndex(s=>s.id===draft.id)] = {...draft};
    else { S.services.push({...draft, id:'s'+S.nextId++}); S.order.push(draft.id+':p', draft.id+':d'); }
    $('editor').hidden=true; invalidate(); render();
};

function startPick(target) { picking=target; $('mapHint').style.display='block'; $('map').style.cursor='crosshair'; }
function cancelPick() { picking=null; $('mapHint').style.display='none'; $('map').style.cursor=''; }
$('btnMapOrigin').onclick=()=> startPick('origin');
$('btnMapPickup').onclick=()=> startPick('pickup');
$('btnMapDropoff').onclick=()=> startPick('dropoff');
$('cancelPick').onclick=cancelPick;

map.on('click', e => {
    if(picking) selectPoint(picking, {lat: e.latlng.lat, lng: e.latlng.lng, name: `Marcador en Mapa (${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)})`});
});

$('finishBase').onclick=()=>{ S.finish={name:'Base San Fernando', lat:40.4253, lng:-3.5350}; toast('Fin de ruta: Base S. Fernando'); invalidate(); render(); };
$('finishLast').onclick=()=>{ S.finish=null; toast('Fin de ruta: Último destino'); invalidate(); render(); };
$('capacity').onchange=()=> { S.capacity=Number($('capacity').value); invalidate(); render(); };
$('clear').onclick=()=>{ if(confirm('¿Limpiar toda la ruta?')) {S.services=[]; S.order=[]; S.finish=null; invalidate(); render();} };

function stopGPS(){if(S.watch!==null) navigator.geolocation.clearWatch(S.watch); S.watch=null; $('gpsStatus').textContent='GPS inactivo'; $('gpsStatus').className='badge';}
$('gps').onclick=()=>{
    if(S.watch!==null){stopGPS();return;}
    $('gpsStatus').textContent='Buscando...';
    S.watch=navigator.geolocation.watchPosition(p=>{
        S.origin={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,type:'gps',name:'Tu Posición Actual'};
        paintOrigin(); $('gpsStatus').textContent='GPS Activo'; $('gpsStatus').className='badge ok';
        if(routeNodes().length>0) $('organize').disabled=false;
    }, e=>toast('Sin señal GPS'), {enableHighAccuracy:true});
};

function paintOrigin(){
    if(originMarker) map.removeLayer(originMarker); if(accuracyCircle) map.removeLayer(accuracyCircle);
    if(!S.origin) return;
    if(S.origin.type==='gps'){
        originMarker=L.marker([S.origin.lat,S.origin.lng],{icon:L.divIcon({className:'ambulance',html:'🚑',iconSize:[40,40]})}).addTo(map);
    } else {
        originMarker=L.circleMarker([S.origin.lat,S.origin.lng],{radius:10,color:'#fff',weight:3,fillColor:'#79c9ff',fillOpacity:1}).addTo(map);
    }
    $('originName').textContent = S.origin.name;
}

function pendingNodes(){return S.services.flatMap(s=>[...(s.status==='pending'?[{...s.pickup,id:s.id+':p',sid:s.id,type:'pickup',service:s.name}]:[]),{...s.dropoff,id:s.id+':d',sid:s.id,type:'dropoff',service:s.name}])}
function routeNodes(){const ns=pendingNodes(); return [...S.order.map(id=>ns.find(n=>n.id===id)).filter(Boolean), ...(S.finish?[{...S.finish,id:'finish',type:'finish',service:'Fin'}] : [])];}
function invalidate() { S.busy=false; if(routeLine){map.removeLayer(routeLine);routeLine=null;} $('distance').textContent='—'; $('duration').textContent='—'; $('arrival').textContent='—'; $('legs').innerHTML=''; }

function render(){
    markers.clearLayers(); $('services').replaceChildren();
    S.services.forEach(s=>{
        const box=element('div','service');
        box.append(element('div','name',s.name), element('div','path','📍 '+s.pickup.name), element('div','path','🏁 '+s.dropoff.name));
        const actions=element('div','actions');
        actions.append(button('Editar','',()=>edit(s.id)), button('Borrar','',()=> {S.services=S.services.filter(x=>x.id!==s.id); S.order=S.order.filter(id=>!id.startsWith(s.id)); invalidate(); render();}));
        box.append(actions); $('services').append(box);
    });
    
    $('stops').replaceChildren(); const ns = routeNodes();
    ns.forEach((p,i)=>{
        const row=element('div','stop'), num=element('span','number '+p.type,i+1), info=element('div','grow');
        info.append(element('span','type '+p.type,(p.type==='pickup'?'RECOGIDA':p.type==='dropoff'?'DESTINO':'FIN')+' · '+p.service), element('strong','',p.name));
        row.append(num,info); $('stops').append(row);
        L.marker([p.lat,p.lng],{icon:L.divIcon({className:'pin '+p.type,html:i+1,iconSize:[34,34]})}).addTo(markers);
    });
    
    const ready = !!S.origin && ns.length>0;
    $('organize').disabled = !ready || S.busy;
    $('organize').textContent = S.busy ? 'Calculando...' : '✦ Optimizar Ruta';
    $('navigate').disabled = !ready;
    $('finishBase').style.borderColor = S.finish ? 'var(--accent)' : 'var(--line)';
}

$('center').onclick=()=>S.origin && map.setView([S.origin.lat,S.origin.lng],15);
$('fit').onclick=()=>{
    if(routeLine) map.fitBounds(routeLine.getBounds(),{padding:[40,40]});
    else {const ps=[...(S.origin?[S.origin]:[]),...routeNodes()]; if(ps.length) map.fitBounds(ps.map(p=>[p.lat,p.lng]),{padding:[40,40]});}
};

// Optimizador TSP de OSRM
async function calculate() {
    if(!S.origin || !routeNodes().length) return;
    invalidate(); S.busy=true; render();
    try {
        const ns=pendingNodes();
        const points=[S.origin, ...ns, ...(S.finish?[S.finish]:[])];
        const path=points.map(p=>p.lng+','+p.lat).join(';');
        const mData=await fetch('https://router.project-osrm.org/table/v1/driving/'+path+'?annotations=duration').then(r=>r.json());
        
        const n=ns.length, total=1<<n;
        const edge=(a,b)=>Number.isFinite(mData.durations[a]?.[b])?mData.durations[a][b]:Infinity;
        const memo=new Map(), choice=new Map();
        function solve(mask,last){
            const key=mask*(n+1)+last; if(memo.has(key)) return memo.get(key);
            if(mask===total-1) return S.finish?edge(last,n+1):0;
            const aboard=new Set(); for(let i=0;i<n;i++){if(mask&(1<<i)){if(ns[i].type==='pickup')aboard.add(ns[i].sid); if(ns[i].type==='dropoff')aboard.delete(ns[i].sid);}}
            let best=Infinity, next=-1;
            for(let i=0;i<n;i++){
                if(mask&(1<<i)) continue;
                if(ns[i].type==='dropoff'&&!aboard.has(ns[i].sid) || ns[i].type==='pickup'&&aboard.size>=S.capacity) continue;
                const cost=edge(last,i+1)+solve(mask|(1<<i),i+1);
                if(cost<best){best=cost; next=i;}
            }
            memo.set(key,best); choice.set(key,next); return best;
        }
        solve(0,0);
        const res=[]; let mask=0, last=0;
        while(mask!==total-1){const i=choice.get(mask*(n+1)+last); res.push(ns[i].id); mask|=1<<i; last=i+1;}
        S.order = res; render();
        
        // Dibujar ruta
        const ordNodes = routeNodes();
        const rPath = [S.origin, ...ordNodes].map(p=>p.lng+','+p.lat).join(';');
        const rData = await fetch('https://router.project-osrm.org/route/v1/driving/'+rPath+'?overview=full&geometries=geojson').then(r=>r.json());
        routeLine = L.geoJSON(rData.routes[0].geometry,{style:{color:'#63e3ba',weight:6,opacity:.9}}).addTo(map);
        
        $('distance').textContent = (rData.routes[0].distance/1000).toFixed(1)+' km';
        $('duration').textContent = Math.round(rData.routes[0].duration/60)+' min';
        $('arrival').textContent = new Date(Date.now()+rData.routes[0].duration*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        $('fit').click();
    } catch(e){ toast('Error al calcular ruta.'); } finally { S.busy=false; render(); }
}
$('organize').onclick = calculate;

// Exportar ruta a Google Maps App
$('navigate').onclick = () => {
    if(!S.origin) return;
    const nodes = routeNodes();
    if(!nodes.length) return;
    const originStr = `${S.origin.lat},${S.origin.lng}`;
    const destStr = `${nodes[nodes.length - 1].lat},${nodes[nodes.length - 1].lng}`;
    const waypoints = nodes.slice(0, -1).map(p => `${p.lat},${p.lng}`).join('|');
    let url = `https://www.google.com/maps/dir/?api=1&origin=${originStr}&destination=${destStr}&travelmode=driving`;
    if(waypoints) url += `&waypoints=${waypoints}`;
    window.open(url, '_blank');
    toast('Abriendo Google Maps con tráfico...');
};

render();
</script>
